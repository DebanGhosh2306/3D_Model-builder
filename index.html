<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prompt 3D Model Builder</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: #111827;
      --accent: #22d3ee;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --ok: #34d399;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      min-height: 100vh;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(290px, 360px) 1fr;
      min-height: 100vh;
    }

    .panel {
      padding: 1rem;
      border-right: 1px solid rgba(148, 163, 184, 0.18);
      background: linear-gradient(160deg, rgba(17, 24, 39, 0.92), rgba(15, 23, 42, 0.96));
      backdrop-filter: blur(6px);
      overflow: auto;
    }

    .panel h1 {
      font-size: 1.2rem;
      margin: 0;
    }

    .panel p {
      color: var(--muted);
      line-height: 1.45;
      margin: 0.65rem 0 1rem;
    }

    .input-row {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    input, button {
      border-radius: 0.7rem;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: rgba(30, 41, 59, 0.65);
      color: var(--text);
      font-size: 0.95rem;
      padding: 0.7rem 0.8rem;
    }

    input:focus {
      outline: 2px solid rgba(34, 211, 238, 0.5);
      border-color: transparent;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.5rem;
    }

    button {
      cursor: pointer;
      border-color: rgba(34, 211, 238, 0.45);
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.28), rgba(14, 165, 233, 0.1));
      transition: transform .15s ease, box-shadow .15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(34, 211, 238, 0.15);
    }

    .status {
      margin-top: 0.7rem;
      font-size: 0.9rem;
      color: var(--ok);
    }

    #canvas-wrap {
      position: relative;
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .hint,
    .chips {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: var(--muted);
      background: rgba(30, 41, 59, 0.35);
      border-radius: 0.7rem;
      padding: 0.65rem 0.75rem;
    }

    .chips button {
      margin: 0.3rem 0.2rem 0 0;
      padding: 0.45rem 0.6rem;
      border-radius: 0.55rem;
      font-size: 0.82rem;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow: none;
      transform: none;
    }

    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .panel { border-right: 0; border-bottom: 1px solid rgba(148, 163, 184, 0.18); }
      #canvas-wrap { min-height: 65vh; }
    }
  </style>
</head>
<body>
  <main class="layout">
    <aside class="panel">
      <h1>3D Model Builder</h1>
      <p>Type a prompt and generate a scrollable 3D object. Drag to rotate and use your mouse wheel/trackpad to zoom.</p>

      <div class="input-row">
        <input id="prompt" type="text" value="glowing crystal sphere" placeholder="Try: giant red cube, tiny glass sphere" />
        <div class="actions">
          <button id="generate">Generate model</button>
          <button id="reset-camera" type="button">Reset camera</button>
          <button id="snapshot" type="button">Save PNG</button>
        </div>
      </div>

      <div class="chips" style="margin-top:0.7rem">
        Quick controls:<br />
        <button type="button" id="toggle-spin">Pause spin</button>
        <button type="button" id="toggle-wireframe">Wireframe off</button>
      </div>

      <div id="status" class="status" aria-live="polite"></div>

      <div class="chips">
        Quick prompts:<br />
        <button type="button" class="prompt-chip">gold metallic torus</button>
        <button type="button" class="prompt-chip">tiny blue glass sphere</button>
        <button type="button" class="prompt-chip">large green cone</button>
        <button type="button" class="prompt-chip">neon purple crystal</button>
      </div>

      <div class="hint">
        Prompt keywords can affect <strong>shape</strong>, <strong>color</strong>, <strong>material</strong>, and <strong>size</strong>.
        Try words like <em>tiny</em>, <em>big</em>, <em>metallic</em>, <em>glass</em>, and <em>glowing</em>.
      </div>
    </aside>
    <section id="canvas-wrap"></section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
